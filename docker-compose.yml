# Lancement « type production » en local : API .NET + front nginx (qui proxie /api).
# Usage : docker compose up --build  →  http://localhost:8080
services:
  api:
    build: ./api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Jwt__Key: ${FRAMEFORGE_JWT_KEY:-}
      ConnectionStrings__Default: Data Source=/data/frameforge.db
      # Stripe__SecretKey: "sk_test_..."            # optionnel (sinon paiement simulé)
    volumes:
      - api-data:/data                              # persiste uniquement SQLite, sans masquer api.dll
    expose:
      - "8080"

  web:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  api-data:
