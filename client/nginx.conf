server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # En-têtes de sécurité côté front. La liste des tiers correspond aux ressources réellement
  # utilisées et reste alignée sur la politique Netlify du déploiement statique.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https://www.freetogame.com https://*.goatcounter.com; font-src 'self' https://fonts.gstatic.com; form-action 'self'; frame-ancestors 'none'; frame-src 'none'; img-src 'self' data: blob: https://www.freetogame.com https://*.freetogame.com https://i.ebayimg.com https://upload.wikimedia.org; manifest-src 'self'; object-src 'none'; script-src 'self' https://gc.zgo.at; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com" always;

  # Proxy des appels API vers le service back-end (nom 'api' en docker-compose).
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Santé de l'API exposée sans rendre le port du conteneur public.
  location = /health {
    proxy_pass http://api:8080/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA : toutes les routes retombent sur index.html (React Router).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
