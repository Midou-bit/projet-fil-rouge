name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # Pas de .sln dans ce repo : on cible api.Tests.csproj, qui référence api.csproj
      # (ProjectReference) et construit donc les deux.
      - name: Restore
        run: dotnet restore api.Tests/api.Tests.csproj
      - name: Build
        run: dotnet build api.Tests/api.Tests.csproj --no-restore --configuration Release
      - name: Test
        run: dotnet test api.Tests/api.Tests.csproj --no-build --configuration Release

  client:
    name: Client (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
