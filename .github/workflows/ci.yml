name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # Le projet de tests référence l'API : le cibler garde les étapes CI explicites et restaure
      # les deux projets sans dépendre du format de solution de l'environnement runner.
      - name: Restore
        run: dotnet restore api.Tests/api.Tests.csproj
      - name: Build
        run: dotnet build api.Tests/api.Tests.csproj --no-restore --configuration Release
      - name: Test
        run: >-
          dotnet test api.Tests/api.Tests.csproj --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
      - name: Enforce API line coverage (>= 50%)
        shell: bash
        run: |
          coverage_file="$(find TestResults -name coverage.cobertura.xml -print -quit)"
          test -n "$coverage_file"
          line_rate="$(sed -n 's/.*line-rate="\([0-9.]*\)".*/\1/p' "$coverage_file" | head -n 1)"
          test -n "$line_rate"
          awk -v rate="$line_rate" 'BEGIN { exit !(rate >= 0.50) }'
      - name: Audit NuGet dependencies
        run: dotnet list api/api.csproj package --vulnerable --include-transitive
      - name: Upload API coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: TestResults/**/coverage.cobertura.xml

  client:
    name: Client (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test and enforce coverage
        run: npm run test:coverage
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
      - name: Upload client coverage
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: client/coverage/

  containers:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [api, client]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config
      - name: Build images
        run: docker compose build
