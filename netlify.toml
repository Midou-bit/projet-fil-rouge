# Configuration de build Netlify pour le front FrameForge.
# Netlify lit ce fichier automatiquement : aucun réglage à saisir dans l'interface.
# (Les règles de redirection restent dans client/public/_redirects.)

[build]
  base = "client"          # le front vit dans client/
  command = "npm run build"
  publish = "dist"         # relatif à `base` → client/dist

[build.environment]
  NODE_VERSION = "20"
  # Mesure d'audience GoatCounter (gratuite, sans cookie). Renseigner le code de site pour
  # l'activer, par exemple VITE_GOATCOUNTER_CODE = "frameforge". Absente ou vide, aucun
  # script de suivi n'est chargé et la bannière cookies n'a rien à activer.
  VITE_GOATCOUNTER_CODE = ""
